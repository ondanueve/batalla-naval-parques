<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parques en Guerra 🇦🇷</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="menu" class="screen">
    <h1>🌲 Parques en Guerra</h1>
    <p>RPG Pokémon · Parques Argentinos</p>
    <div class="options">
      <h2>Mapa</h2>
      <div class="maps">
        <button class="map-btn selected" data-map="nahuel">🏞️ Nahuel Huapi</button>
        <button class="map-btn" data-map="iguazu">🌿 Iguazú</button>
        <button class="map-btn" data-map="glaciares">❄️ Los Glaciares</button>
      </div>
      <h2>Terreno</h2>
      <div class="terrains">
        <button class="terrain-btn selected" data-terrain="agua">💧 Agua</button>
        <button class="terrain-btn" data-terrain="tierra">🏔️ Tierra</button>
        <button class="terrain-btn" data-terrain="mixto">🌊 Mixto</button>
      </div>
      <h2>Modo</h2>
      <div class="modes">
        <button id="mode-pvp" class="mode-btn">👥 PvP Online</button>
        <button id="mode-pvc" class="mode-btn selected">🤖 PvC (IA)</button>
      </div>
      <h2>Invasor</h2>
      <select id="invader">
        <option value="chile">🇨🇱 Chile</option>
        <option value="uk">🇬🇧 Reino Unido</option>
        <option value="usa">🇺🇸 EE.UU.</option>
        <option value="china">🇨🇳 China</option>
        <option value="rusia">🇷🇺 Rusia</option>
        <option value="brasil">🇧🇷 Brasil</option>
      </select>
      <button id="start-btn" class="big">¡Comenzar Batalla!</button>
      <div id="invite-box" class="hidden">
        <p>Compartí este enlace:</p>
        <input id="invite-link" readonly>
        <button id="copy-link">Copiar enlace</button>
        <p id="waiting">Esperando al rival...</p>
      </div>
    </div>
    <button id="juke-btn" style="margin-top:0.5rem">🎵 Jukebox</button>
  </div>

  <div id="game" class="screen hidden">
    <div class="hud">
      <div class="player argentina">🇦🇷 <span id="arg-hp">100</span></div>
      <div class="turn" id="turn-indicator">Turno 🇦🇷</div>
      <div class="player invader">Inv <span id="inv-hp">100</span></div>
    </div>
    <div id="timer" class="hidden">10</div>
    <div class="boards">
      <div class="board-container">
        <h3>Tu Territorio</h3>
        <canvas id="own-board" width="300" height="300"></canvas>
      </div>
      <div class="board-container">
        <h3>Enemigo</h3>
        <canvas id="enemy-board" width="300" height="300"></canvas>
      </div>
    </div>
    <div class="controls">
      <button id="rotate-btn" class="hidden">🔄 Rotar</button>
    </div>
    <div class="powers">
      <button id="power-radar">📡 Radar</button>
      <button id="power-bomb">💣 Bomba</button>
      <button id="power-camo">👻 Camo</button>
    </div>
    <div id="message">Tocá una unidad para moverla</div>
    <button id="back-btn">Menú</button>
  </div>

  <div id="juke-panel" class="panel hidden">
    <h2>🎵 Jukebox</h2>
    <select id="song-select"></select>
    <button id="play-juke">▶</button>
    <button id="stop-juke">⏹</button>
    <input type="range" id="vol-juke" min="0" max="1" step="0.1" value="0.2">
    <button id="close-juke">Cerrar</button>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
